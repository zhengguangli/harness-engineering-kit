name: skill-triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  enforce-developer-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR source is developer branch
        run: |
          head="${{ github.head_ref }}"
          if [ "$head" != "developer" ]; then
            echo "::error::PR must be opened from developer branch (current: $head)"
            exit 1
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full trigger validation
        run: python3 scripts/run-all.py

      - name: Run skill-level automated checks
        run: |
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            script="$skill_dir/references/automated_check_script.py"
            if [ -f "$script" ]; then
              echo "::group::$skill_name checks"
              python3 "$script" || echo "::warning::$skill_name automated checks had failures"
              echo "::endgroup::"
            fi
          done
