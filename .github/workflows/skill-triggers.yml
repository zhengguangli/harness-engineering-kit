name: skill-triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  enforce-developer-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR source is an integration branch
        run: |
          head="${{ github.head_ref }}"
          # Gitflow: work happens on feature/*, which merges into develop,
          # which merges into main. Direct feature/* -> main PRs are rejected.
          case "$head" in
            develop|main|release/*) ;;
            *) echo "::error::PR must come from develop, main or release/* (current: $head)"; exit 1 ;;
          esac
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full trigger validation
        run: python3 scripts/run-all.py

      - name: Run skill-level automated checks
        run: |
          fail_count=0
          total=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            script="$skill_dir/references/automated_check_script.py"
            if [ -f "$script" ]; then
              total=$((total+1))
              echo "::group::$skill_name checks"
              python3 "$script" && echo "  ✅ $skill_name passed" || \
                { echo "::warning::$skill_name automated checks had failures"; fail_count=$((fail_count+1)); }
              echo "::endgroup::"
            fi
          done
          echo "---"
          echo "summary: $((total-fail_count))/$total passed, $fail_count failed"
          if [ "$fail_count" -gt 0 ]; then
            echo "::warning::$fail_count/$total skills had failures"
          fi
